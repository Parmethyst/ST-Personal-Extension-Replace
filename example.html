<div class="my-extension-panel">
    <div class="panel-header">
        <div class="inline-drawer-toggle inline-drawer-header" title="Personal pomodoro settings.">
            <b>Last Message Find & Replace</b>
            <div class="inline-drawer-icon fa-solid fa-circle-chevron-down down"></div>
        </div>
        <div class="panel-body">
            <div class="flex-container">
                <label for="st-fr-target">Find:</label>
                <input type="text" id="st-fr-target" class="text_pole" placeholder="Text to search for..." />
            </div>
            <div class="flex-container">
                <label for="st-fr-replacement">Replace with:</label>
                <input type="text" id="st-fr-replacement" class="text_pole" placeholder="New text..." />
            </div>
            <div class="flex-container">
                <button id="st-fr-execute" class="menu_button">Replace in Last Message</button>
            </div>
            <hr class="sysHR" />
        </div>
    </div>
</div>
